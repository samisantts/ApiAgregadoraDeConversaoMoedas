<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Moedas</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>
        <section>

            <h1>Conversor de Moedas</h1>

            <form id="formConversao">

               
                <div>
                    <label for="moedaOrigem">Moeda de origem</label>

                    <select id="moedaOrigem" name="moedaOrigem">
                        <option value="BRL">🇧🇷 BRL</option>
                        <option value="USD">🇺🇸 USD</option>
                        <option value="EUR">🇪🇺 EUR</option>
                    </select>
                </div>

                <div>
                    <label for="valor">Valor</label>

                    <input
                        type="number"
                        id="valor"
                        name="valor"
                        placeholder="Digite o valor"
                        min="0"
                        step="0.01"
                    >
                </div>
                       <button type="button">inverter</button> 
                <div>
                    <label for="moedaDestino">Moeda de destino</label>

                    <select id="moedaDestino" name="moedaDestino">
                        <option value="USD">🇺🇸 USD</option>
                        <option value="BRL">🇧🇷 BRL</option>
                        <option value="EUR">🇪🇺 EUR</option>
                    </select>

                </div>

                <div>
                    <label for="resultado">valor</label>

                    <input
                        type="text"
                        id="resultado"
                        name="resultado"
                        placeholder="Resultado"
                        readonly
                    >
                </div>

                <button type="submit">Converter</button>

            </form>

        </section>
    </main>

</body>
</html>
