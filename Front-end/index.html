<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Moedas</title>
</head>
<link rel="stylesheet" href="style.css">
<body>
    
    <main>
    <section>
        <h1>Conversor de Moedas</h1>

        <form id="formConversao">

            <div>
                <label for="moedaOrigem">Moeda de origem</label>

                <select id="moedaOrigem" name="moedaOrigem">
                    <option value="BRL\">Real Brasileiro (BRL)</option>
                    <option value="USD">Dólar Americano (USD)</option>
                    <option value="EUR">Euro (EUR)</option>
                </select>
            </div>

            <div>
                <label for="valor">Valor</label>

                <input
                    type="number"
                    id="valor"
                    name="valor"
                    placeholder="digite o valor"
                    min="0"
                    step="0.01"
                >
            </div>
                
            <div>
              <label for="moedaDestino">Moeda de destino</label>
            <select id="moedaDestino" name="moedaDestino">
                <option value="USD">Dólar Americano (USD)</option>
                <option value="BRL">Real Brasileiro (BRL)</option>                    <option value="EUR">Euro (EUR)</option>
                </select>
                <label for="Resultado">Resultado</label>
                <input 
                type="number"
                id="Resultado"
                name="Resultado"
                placeholder="Resultado"\
                readonly="readonly"

            </div>                                

            <button type="submit">Converter</button>
   

</main>
</body>
</html>
